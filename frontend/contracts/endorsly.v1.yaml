components:
  schemas:
    RoleEnum:
      enum:
      - seeker
      - referrer
      type: string
      description: |-
        * `seeker` - seeker
        * `referrer` - referrer
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UserRegistrationRequest:
      type: object
      description: Handles user registration with optional profile creation.
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
        display_name:
          type: string
          minLength: 1
          maxLength: 150
        avatar_url:
          oneOf:
          - type: string
            format: uri
            default: ''
          - type: string
            maxLength: 0
        role:
          $ref: '#/components/schemas/RoleEnum'
        headline:
          type: string
          default: ''
          maxLength: 120
        career_story:
          type: string
          default: ''
        skills:
          type: array
          items:
            type: string
            minLength: 1
        years_of_experience:
          type: integer
          minimum: 0
          default: 0
        current_company:
          type: string
          default: ''
        target_companies:
          type: array
          items:
            type: string
            minLength: 1
        target_roles:
          type: array
          items:
            type: string
            minLength: 1
        location:
          type: string
          default: ''
        education:
          type: string
          default: ''
        why_looking:
          type: string
          default: ''
        company:
          type: string
          default: ''
        department:
          type: string
          default: ''
        job_title:
          type: string
          default: ''
        years_at_company:
          type: integer
          default: 0
        can_refer_to:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - display_name
      - email
      - password
      - role
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
